apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: demo-flux
  namespace: cluster-template
spec:
  interval: 1m
  timeout: 15m
  chart:
    spec:
      chart: ./rke2-rancher-hybrid-calico/1.34.8-wcr.1-rc1
      sourceRef:
        kind: GitRepository
        name: cluster-templates
        namespace: flux-system
  targetNamespace: cluster-template
  values:
    baremetalDefaults:
      users:
        - authorized_keys: [ ]
          name: 'whitestack'
          password: 'whitestack'
    certManager:
      customValues: { }
      enabled: false
    cluster:
      addonsRepoName: whitecruiser-apps
      agentEnvVars: [ ]
      annotations: { }
      enabledCIS: false
      labels: { }
      name: 'cluster-template-userpe11'
    cniConfig:
      additionalConfig: { }
      bgp: true
      internalAddressInterface: ''
      masquerade: true
      mtu: 1440
      multusCustomValues: { }
      multusEnabled: false
      nodeAddressAutodetection:
        method: kubernetes
        value: ''
      podCIDR: 10.42.0.0/16
      serviceCIDR: 10.43.0.0/16
      tunnelProtocol: IPIP
    controlPlaneNodes:
      annotations: { }
      isWorker: true
      labels: { }
      openstack:
        availabilityZone: 'nova'
        enabled: true
        flavorName: 'm1.large'
        imageName: 'Ubuntu_22_RKE2_k-6.8.0-51'
        quantity: 1
        rootVolume: { }
        securityGroups: sec-curso
        userDataFile: ''
      taints: [ ]
    descheduler:
      enabled: false
    etcdDefrag:
      enabled: true
    ingressNginx:
      customValues: { }
      enabled: true
    kubemacpool:
      enabled: false
    kubevirt:
      cdi:
        customValues: { }
        enabled: true
      customValues: { }
      enabled: false
      live_migration: false
      metrics:
        enabled: false
    kured:
      customValues: { }
      enabled: false
    logging:
      clusterOutputs:
        server:
          host: <changeme>
          port: 24224
      customValues: { }
      enabled: false
    macvtapCni:
      deviceConfig: [ ]
      enabled: false
    metallb:
      customValues: { }
      enabled: true
    monitoring:
      customValues: { }
      enabled: false
      thanos:
        objectStorage:
          accessKey: <changeme>
          bucket: <changeme>
          endpoint: <changeme:changeme>
          secretKey: <changeme>
      thanosIngress:
        host: <changeme>
    nmstateOperator:
      enabled: false
    nodeConfigOperator:
      customValues: { }
      enabled: false
      managerConfig:
        aptEnabled: true
        hostfsEnabled: true
    nodeHealthcheckOperator:
      enabled: false
    ntp:
      customValues: { }
      enabled: false
    openstackDefaults:
      authUrl: 'http://10.102.0.19:5000'
      caCerts:
