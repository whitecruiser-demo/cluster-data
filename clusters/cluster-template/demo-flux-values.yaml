        customValues: { }
        enabled: true
        replicas: '2'
    workerNodes:
      annotations: { }
      labels: { }
      openstack:
        availabilityZone: 'nova'
        enabled: true
        flavorName: 'm1.large'
        imageName: 'Ubuntu_22_RKE2_k-6.8.0-51'
        quantity: 1
