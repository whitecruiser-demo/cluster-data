            credentialsSecret:
              name: ''
              namespace: ''
            provider: ''
          finalCommands: ''
          storage: [ ]
        nodes: [ ]
      labels: { }
      openstack:
        availabilityZone: 'nova'
        enabled: true
        flavorName: 'm1.large'
        imageName: 'Ubuntu 22 RKE2 k-6.8.0-51'
        quantity: 1
