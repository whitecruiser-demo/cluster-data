apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: demo-flux
  namespace: cyndi-demo
spec:
  interval: 5m
  chart:
    spec:
      chart: ./rke2-rancher-hybrid-calico/1.34.8-wcr.1-rc1
      sourceRef:
        kind: GitRepository
        name: cluster-templates
        namespace: flux-system
  targetNamespace: cyndi-demo
  values:
    baremetalDefaults:
      image:
        name: ubuntu-22.04.5-live-server-amd64-deps.iso
      kernel:
        version: 6.5.0-35-generic
      operatorOptions:
        forceReinstallOS: false
        skipDiffChecker: false
      users:
        - authorized_keys: [ ]
          name: 'whitestack'
          password: 'whitestack'
    certManager:
      customValues: { }
      enabled: false
    cluster:
      addonsRepoName: whitecruiser-apps
      agentEnvVars: [ ]
      annotations: { }
      enabledCIS: false
      etcd:
        backup:
          disableAutomaticSnapshots: true
        exposeMetrics: false
        extraArgs: [ ]
      kubeComponents:
        kubeApiServer:
          extraArgs: [ ]
        kubeControllerManager:
          extraArgs: [ ]
        kubeProxy:
          extraArgs: [ ]
        kubeScheduler:
          extraArgs: [ ]
        kubelet:
          extraArgs: [ ]
        labelSpecificConfigs: [ ]
      labels: { }
      name: 'cluster-test'
    cniConfig:
      additionalConfig: { }
      bgp: true
      internalAddressInterface: ''
      masquerade: true
      mtu: 1440
      multusCustomValues: { }
      multusEnabled: false
      nodeAddressAutodetection:
        method: kubernetes
        value: ''
      podCIDR: 10.42.0.0/16
      serviceCIDR: 10.43.0.0/16
      tunnelProtocol: IPIP
    controlPlaneNodes:
      annotations: { }
      baremetal:
        defaults:
          bmc:
            credentialsSecret:
              name: ''
              namespace: ''
            provider: ''
          finalCommands: ''
          storage: [ ]
        nodes: [ ]
      isWorker: true
      labels: { }
      openstack:
        availabilityZone: 'nova'
        enabled: true
        flavorName: 'm1.large'
        imageName: 'Ubuntu 22 RKE2 k-6.8.0-51'
        quantity: 1
        rootVolume: { }
        securityGroups: 'all'
        userDataFile: ''
      taints: [ ]
    descheduler:
      customValues: { }
      enabled: false
      lowNodeUtilization:
        enabled: false
        targetThresholds:
          cpu: 60
          memory: 60
        thresholds:
          cpu: 20
          memory: 20
    etcdDefrag:
      customValues: { }
      enabled: true
    ingressNginx:
      customValues: { }
      enabled: true
    kubemacpool:
      enabled: false
    kubevirt:
      cdi:
        customValues: { }
        enabled: true
      customValues: { }
      dashboard:
        customValues: { }
        enabled: true
        ingress:
          enabled: false
          host: <changeme>
          tls:
            enabled: false
            secretName: ''
        proxy:
          localAuthentication:
            password: ''
            username: admin
      enabled: false
      live_migration: true
      metrics:
        enabled: true
    kured:
      customValues: { }
      enabled: false
    logging:
      clusterOutputs:
        server:
          host: <changeme>
          port: 24224
      customValues: { }
      enabled: false
    macvtapCni:
      deviceConfig: [ ]
      enabled: false
    metallb:
      customValues: { }
      enabled: true
    monitoring:
      customValues: { }
      enabled: true
      thanos:
        objectStorage:
          accessKey: <changeme>
          bucket: <changeme>
          endpoint: <changeme:changeme>
          secretKey: <changeme>
      thanosIngress:
        host: <changeme>
    nmstateOperator:
      enabled: false
    nodeConfigOperator:
      customValues: { }
      enabled: false
      managerConfig:
        aptEnabled: true
        hostfsEnabled: true
    nodeHealthcheckOperator:
      enabled: false
    ntp:
      customValues: { }
      enabled: false
    openstackDefaults:
      authUrl: 'http://10.100.1.22:5000'
      caCerts:
        configMap:
          name: ''
          namespace: ''
      domainName: Default
      keypairName: 'wcruiser-curso'
      netName: 'PUBLIC'
      password:
